[project]
name = "sky-server"
version = "0.1.0"
description = "空の写真と撮影時のメタデータを受け取るアップロード API"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "python-multipart",
    "httpx",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.0",
    "google-cloud-tasks>=2.26.0",
    "google-auth>=2.61.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sky_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
