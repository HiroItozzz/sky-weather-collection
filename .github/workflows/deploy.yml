# v で始まるタグの push で、テストを流してからステージングの Cloud Run に出す。
# 仕組みと GCP 側の準備は docs/cd.md にある。
name: Deploy (staging)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# プロジェクト ID を変えたときは、この4つをすべて直す（docs/cd.md 2節）
env:
  PROJECT_ID: sky-weather-stg
  REGION: asia-northeast1
  SERVICE: sky-server
  IMAGE: asia-northeast1-docker.pkg.dev/sky-weather-stg/sky/sky-server
  # docs/cd.md 2.3節の最後のコマンドで表示される値
  WIF_PROVIDER: projects/671929077433/locations/global/workloadIdentityPools/github/providers/sky-weather-collection
  DEPLOY_SA: sky-deployer@sky-weather-stg.iam.gserviceaccount.com

jobs:
  # 誤操作の防止。タグを push できる人なら、このワークフローごと書き換えられるので、
  # 守りはタグのルールセットで行う（docs/cd.md 1.1節）
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: タグが main のコミットを指しているか確かめる
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::タグ ${GITHUB_REF_NAME} の指すコミットが main に含まれていません"
            exit 1
          fi

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    # デプロイが重ならないようにする。待っている run は最新の1つだけが残る
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Workload Identity 連携で GitHub の ID トークンを取るため
    steps:
      - uses: actions/checkout@v4

      # ID トークンを扱うアクションは、コミットの SHA で固定する
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: イメージをビルドして push する
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" server
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: デプロイする
        run: |
          gcloud run deploy "$SERVICE" --image="${IMAGE}:${GITHUB_SHA}" --region="$REGION" --quiet
          # 手で古いリビジョンに戻していた場合も、新しいリビジョンに戻す
          gcloud run services update-traffic "$SERVICE" --region="$REGION" --to-latest --quiet

      - name: 動いているか確かめる
        run: |
          url=$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 3 "${url}/health"
