name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest

  # ローカル版のサーバーを起動して、アプリの通信部分を実際のサーバーに対して確かめる
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: サーバーを起動する
        working-directory: server
        env:
          SKY_DATA_DIR: ${{ runner.temp }}/sky-data
        run: |
          uv sync --frozen --no-dev
          uv run python -m sky_server.admin create-user --name ci > "$RUNNER_TEMP/user.txt"
          uv run uvicorn sky_server.main:create_app --factory --port 8765 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8765/healthz && break; sleep 1; done
      - name: 通しのテスト
        working-directory: app
        run: |
          npm ci
          export SKY_E2E_TOKEN="$(sed -n 's/^招待コード.*: //p' "$RUNNER_TEMP/user.txt")"
          SKY_E2E_URL=http://127.0.0.1:8765 npm run test:e2e
      - name: サーバーのログ
        if: always()
        run: cat "$RUNNER_TEMP/server.log"
